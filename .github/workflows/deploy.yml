name: Deploy Application

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Deploy Application
      run: |
        echo "Deploying application..."
        docker build -t dharanigone/saucelab_demotest:latest .
        docker push dharanigone/saucelab_demotest:latest
        